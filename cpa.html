<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal da CPA – Faculdade Impacta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#fff;--soft:#F5F6F8;--ink:#14161A;--muted:#5E6673;--line:#E3E6EB;--brand:#E30613;--brand-d:#B80510;--graph:#14161A;--teal:#C40510;--ok:#138A4B;--err:#C40510;--accent:#E30613;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;position:relative}
body::before{content:"";position:absolute;inset:0 0 auto 0;height:420px;background:radial-gradient(circle,#D5D9E0 1.2px,transparent 1.3px) 0 0/24px 24px;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);pointer-events:none;z-index:0}
header,main,footer{position:relative;z-index:1}
header{background:rgba(255,255,255,.92);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-weight:700;font-size:19px;letter-spacing:-.02em;margin-right:auto;display:flex;align-items:center;gap:12px;line-height:1.1;cursor:pointer}
.logo small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:2px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--brand);position:relative;flex:none;box-shadow:0 6px 16px -6px rgba(227,6,19,.7)}
.mark::before{content:"";position:absolute;left:11px;top:9px;width:4px;height:4px;border-radius:50%;background:#fff}
.mark::after{content:"";position:absolute;left:11px;top:16px;width:4px;height:11px;border-radius:2px;background:#fff;box-shadow:9px -7px 0 0 #fff,9px 0 0 0 #fff}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;padding:8px 13px;border-radius:8px;font-weight:500;font-size:14.5px}
nav a:hover{background:var(--soft)}
nav a[aria-current="page"]{color:var(--brand);background:#FDECEE;font-weight:700}
.who{font-size:13px;display:flex;align-items:center;gap:10px;color:var(--muted)}
.badge-role{background:var(--soft);border:1px solid var(--line);padding:5px 10px;border-radius:8px;color:var(--ink);font-weight:600}
main{max-width:1120px;margin:0 auto;padding:40px 24px 72px}
h1{font-size:clamp(28px,4.4vw,40px);line-height:1.08;margin:0 0 10px;letter-spacing:-.035em;font-weight:700}
h2{font-size:20px;margin:0 0 8px;font-weight:700;letter-spacing:-.015em}
.lead{color:var(--muted);margin:0 0 28px;max-width:65ch;font-size:17px}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button,.btn{font:inherit;font-weight:600;font-size:14.5px;border:1px solid var(--brand);background:var(--brand);color:#fff;padding:10px 18px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,box-shadow .15s}
button:hover,.btn:hover{background:var(--brand-d);box-shadow:0 6px 18px -8px rgba(227,6,19,.8)}
button:disabled{opacity:.6;cursor:not-allowed}
button.alt,.btn.alt{background:#fff;color:var(--ink);border-color:var(--line)}
button.alt:hover,.btn.alt:hover{background:var(--soft);box-shadow:none}
button.acc{background:var(--graph);border-color:var(--graph);color:#fff}
button.acc:hover{background:#000}
button.sm{padding:6px 12px;font-size:13px;border-radius:8px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px #FDECEE}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 1px 0 rgba(20,22,26,.03),0 12px 30px -22px rgba(20,22,26,.35)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.auth{display:grid;grid-template-columns:1.05fr 1fr;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 30px 60px -40px rgba(20,22,26,.5)}
.auth-side{background:var(--graph);color:#fff;padding:44px 36px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:440px}
.auth-side::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px) 0 0/32px 32px}
.auth-side::after{content:"";position:absolute;width:340px;height:340px;right:-120px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(227,6,19,.85),transparent 68%)}
.auth-side>*{position:relative;z-index:1}
.auth-side h1{color:#fff;font-size:clamp(28px,3.4vw,38px)}
.auth-side p{color:#B9BFC9;margin:0;max-width:34ch}
.auth-form{padding:36px}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;background:var(--soft);padding:5px;border-radius:12px;width:fit-content;max-width:100%}
.tabs button{background:transparent;color:var(--muted);border-color:transparent;box-shadow:none}
.tabs button:hover{background:#fff;color:var(--ink)}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:0 2px 8px -4px rgba(20,22,26,.4)}
.note{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:14px;color:var(--ink)}
.note.warn{background:#FFF8EB;border-color:#F5D487;color:#664400}
.dash{height:1600px;width:100%;border:1px solid var(--line);border-radius:14px;background:#fff}
.tag{display:inline-block;font:500 12px "JetBrains Mono",ui-monospace,monospace;padding:3px 10px;border-radius:99px;background:#FDECEE;color:var(--teal)}
.tag.ok{background:#E4F5EC;color:var(--ok)}
.tag.wip{background:#FFF3D6;color:#7A5200}
.meta{font-size:13px;color:var(--muted)}
.resp{border-left:3px solid var(--brand);padding:2px 0 2px 14px;margin:14px 0 0}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border:0}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.filters input{max-width:300px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:13px}
td.c,th.c{text-align:center}
.yes{color:var(--ok);font-weight:800}.no{color:#B0B6C0}
details summary{cursor:pointer;font-weight:700}
footer{max-width:1120px;margin:0 auto;padding:22px 24px 40px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--graph);color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#toast.on{opacity:1}
.err{color:var(--err);font-size:13.5px;margin-top:8px;min-height:18px}
.db-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);font-weight:600}
.db-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.otp-box{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
@media (max-width:760px){
  .auth{grid-template-columns:1fr}
  .auth-side{min-height:200px;padding:28px}
  .auth-form{padding:28px 22px}
  .dash{height:950px}
  .filters input{max-width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <span>Comissão Própria de Avaliação · Faculdade Impacta</span>
  <span class="db-badge" id="db-status">Supabase & EmailJS conectados</span>
</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// 1. Conexão Supabase
var SUPABASE_URL='https://prblkovrpjefkpxstlzg.supabase.co';
var SUPABASE_KEY='sb_publishable_wT7ZzgeVMzeYlszwxPpS4Q_OsWR5Qpn';
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// 2. Conexão EmailJS (Disparo gratuito de códigos OTP e convites MEC)
var EMAILJS_SERVICE_ID='service_fkpv5bz';
var EMAILJS_TEMPLATE_ID='template_o2yyo4c';
var EMAILJS_PUBLIC_KEY='MaIAgSgfFtupvPpJP';
emailjs.init({publicKey:EMAILJS_PUBLIC_KEY});

var PORTAL_URL_PADRAO='https://cpa.impacta.edu.br';
var SESSION_KEY='cpa_impacta_session_v1';
var LOGS_BACKUP_KEY='cpa_logs_backup_v1';

// Estado da verificação por código OTP (6 dígitos) no e-mail institucional
var OTP={email:'',code:'',expires:0,role:'aluno',nome:'',sent:false};

var DB={
  u:null,
  users:{
    'aluno@impacta.edu.br':{n:'Aluno Demonstração',r:'aluno',tipo:'sso',core:true},
    'coord@impacta.edu.br':{n:'Coordenação de Curso',r:'coord',tipo:'sso',core:true},
    'cpa@impacta.edu.br':{n:'Administração CPA',r:'cpa',tipo:'sso',core:true},
    'avaliador@mec.gov.br':{n:'Comissão Avaliadora MEC',r:'aval',tipo:'token',token:'MEC-2026',exp:'2026-12-31'}
  },
  dash:[
    {id:'pres',t:'Aluno(a) Presencial',d:'Pesquisa institucional respondida pelos discentes dos cursos presenciais.',roles:['aluno','coord','cpa','aval'],url:'https://datastudio.google.com/embed/reporting/c6fac40f-46c9-489d-a63f-653537ca5719/page/p_k1tjc7bebd'},
    {id:'ead',t:'Aluno(a) EAD',d:'Pesquisa institucional respondida pelos discentes dos cursos a distância.',roles:['aluno','coord','cpa','aval'],url:'https://datastudio.google.com/embed/reporting/a29dac9a-c940-4eec-9d63-7d811debf2ec/page/p_k1tjc7bebd'},
    {id:'prof',t:'Professores',d:'Avaliação institucional sob a perspectiva do corpo docente.',roles:['coord','cpa','aval'],url:'https://datastudio.google.com/embed/reporting/ee6a7999-c41a-41e7-9c73-2ac0fff59d49/page/p_k1tjc7bebd'},
    {id:'adm',t:'Corpo técnico-administrativo',d:'Pesquisa respondida pelos colaboradores das áreas administrativas.',roles:['coord','cpa','aval'],url:'https://datastudio.google.com/embed/reporting/d1cfe171-e39a-47bd-abc1-c131be08d632/page/p_k1tjc7bebd'}
  ],
  mural:[
    {id:1,area:'Biblioteca',dem:'Alunos solicitaram horário estendido nas semanas de avaliação.',res:'A biblioteca passou a operar até as 22h nas duas semanas anteriores às provas.',data:'2026-10-20',st:'Resolvido'},
    {id:2,area:'Secretaria Acadêmica',dem:'Prazo elevado para emissão de declarações de matrícula e histórico.',res:'Emissão automatizada pelo portal do aluno com entrega em até 24 horas úteis.',data:'2026-09-30',st:'Resolvido'},
    {id:3,area:'Infraestrutura e TI',dem:'Oscilação de sinal Wi-Fi nos laboratórios do 2º andar.',res:'Novos access points adquiridos; instalação agendada para a janela de manutenção de dezembro.',data:'2026-11-05',st:'Em andamento'}
  ],
  rels:[
    {id:1,t:'Relatório Integral de Autoavaliação Institucional 2025',tipo:'Relatório',data:'2026-03-31',arq:'relatorio-autoavaliacao-2025.pdf'},
    {id:2,t:'Boletim Informativo CPA – 2º Semestre 2026',tipo:'Boletim',data:'2026-10-15',arq:'boletim-cpa-2026-2.pdf'}
  ],
  logs:[],
  contato:{
    chat:'https://chat.google.com',
    meet:'https://meet.google.com',
    horario:'Segunda a sexta, das 14h às 19h (mediante agendamento ou plantão online).'
  }
};

try{
  var savedUser=localStorage.getItem(SESSION_KEY);
  if(savedUser)DB.u=JSON.parse(savedUser);
  var savedLogs=localStorage.getItem(LOGS_BACKUP_KEY);
  if(savedLogs)DB.logs=JSON.parse(savedLogs);
}catch(e){}

var UI={view:'mural',dash:'pres',muralFilter:'Todos',muralSearch:''};
var ROLE={aluno:'Aluno',coord:'Coordenador',cpa:'Admin CPA',aval:'Avaliador MEC',vis:'Visitante'};

function getPortalLoginUrl(){
  if(location.protocol==='http:'||location.protocol==='https:'){
    return location.href.split('#')[0]+'#login';
  }
  return PORTAL_URL_PADRAO+'/#login';
}

function saveSession(){
  try{
    if(DB.u)localStorage.setItem(SESSION_KEY,JSON.stringify(DB.u));
    else localStorage.removeItem(SESSION_KEY);
  }catch(e){}
}

function saveLogsBackup(){
  try{
    localStorage.setItem(LOGS_BACKUP_KEY,JSON.stringify(DB.logs.slice(0,100)));
  }catch(e){}
}

async function registrarAcesso(email, userObj, metodo){
  var localEntry={
    email:email,
    nome:userObj.n||formatNameFromEmail(email),
    role:userObj.r,
    metodo:metodo,
    acessado_em:new Date().toISOString()
  };

  // Mantém histórico local persistente mesmo após logout
  DB.logs.unshift(localEntry);
  saveLogsBackup();

  try{
    var payload={
      email:localEntry.email,
      nome:localEntry.nome,
      role:localEntry.role,
      metodo:localEntry.metodo
    };
    var {data,error}=await sb.from('logs_acesso').insert([payload]).select();
    if(error){
      console.error('Erro Supabase logs_acesso:',error.message);
      toast('Aviso: log salvo localmente, mas o Supabase bloqueou (rode o SQL da tabela logs_acesso).');
      return;
    }
    if(data&&data[0]){
      DB.logs[0]=data[0];
      saveLogsBackup();
      if(UI.view==='acessos')render();
    }
  }catch(e){
    console.error('Erro de rede ao registrar log:',e);
  }
}

async function fetchLogsFromDb(silent){
  var {data,error}=await sb.from('logs_acesso').select('*').order('acessado_em',{ascending:false}).limit(100);
  if(error){
    if(!silent)toast('Erro ao ler histórico do banco: '+error.message);
    return;
  }
  if(data&&data.length){
    DB.logs=data;
    saveLogsBackup();
  }
}

async function refreshLogs(){
  toast('Atualizando histórico...');
  await fetchLogsFromDb(false);
  toast('Histórico sincronizado!');
  render();
}

async function syncFromSupabase(){
  try{
    var [resDash,resMural,resRels,resUsers,resCfg,resLogs]=await Promise.all([
      sb.from('dashboards').select('*'),
      sb.from('mural').select('*').order('data',{ascending:false}),
      sb.from('relatorios').select('*').order('data',{ascending:false}),
      sb.from('usuarios_cpa').select('*'),
      sb.from('configuracoes').select('*').eq('id',1).single(),
      sb.from('logs_acesso').select('*').order('acessado_em',{ascending:false}).limit(100)
    ]);

    if(resDash.data&&resDash.data.length){
      var order=['pres','ead','prof','adm'];
      DB.dash=resDash.data.map(function(d){
        return {id:d.id,t:d.titulo,d:d.descricao,roles:d.roles,url:d.url};
      }).sort(function(a,b){return order.indexOf(a.id)-order.indexOf(b.id)});
    }

    if(resMural.data&&resMural.data.length){
      DB.mural=resMural.data.map(function(m){
        return {id:m.id,area:m.area,dem:m.demanda,res:m.resposta,st:m.status,data:m.data};
      });
    }

    if(resRels.data&&resRels.data.length){
      DB.rels=resRels.data.map(function(r){
        return {id:r.id,t:r.titulo,tipo:r.tipo,data:r.data,arq:r.arquivo_url};
      });
    }

    if(resUsers.data&&resUsers.data.length){
      resUsers.data.forEach(function(u){
        var prev=DB.users[u.email]||{};
        DB.users[u.email]={n:u.nome||prev.n||'',r:u.role,tipo:u.tipo,token:u.token,exp:u.expira_em,core:prev.core||false};
      });
    }

    if(resLogs.data&&resLogs.data.length){
      DB.logs=resLogs.data;
      saveLogsBackup();
    }

    if(resCfg.data){
      DB.contato={
        chat:resCfg.data.chat_url||'https://chat.google.com',
        meet:resCfg.data.meet_url||'https://meet.google.com',
        horario:resCfg.data.horario||DB.contato.horario
      };
    }
  }catch(err){
    console.error(err);
    var st=$('#db-status');
    if(st){st.textContent='Modo offline (erro ao sincronizar)';st.style.color='var(--err)';}
  }
  render();
}

function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function role(){return DB.u?DB.u.r:'vis'}
function fmt(d){if(!d)return '';var p=d.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d}
function fmtDateTime(iso){
  if(!iso)return '';
  var dt=new Date(iso);
  return dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},3500)}
function go(v){location.hash=v}
function allowed(){var r=role();return DB.dash.filter(function(d){return d.roles.indexOf(r)>-1})}

function formatNameFromEmail(email){
  var prefix=email.split('@')[0];
  return prefix.split(/[.,_-]+/).filter(Boolean).map(function(part){
    return part.charAt(0).toUpperCase()+part.slice(1).toLowerCase();
  }).join(' ');
}

function isImpactaDomain(e){
  return /^[^@\s]+@([a-z0-9-]+\.)*impacta\.edu(\.br)?$/i.test(e);
}

function isStudentDomain(e){
  return /^[a-z0-9_-]+(\.[a-z0-9_-]+)+@aluno\.impacta\.edu(\.br)?$/i.test(e);
}

function menu(){
  var m=[];
  if(DB.u)m.push(['dashboards','Dashboards']);
  m.push(['mural','Mural de devolutivas'],['relatorios','Relatórios'],['contato','Contato']);
  if(role()==='cpa')m.push(['acessos','Acessos e Perfis']);
  return m;
}

function bar(){
  var h='<div class="logo" onclick="go(DB.u?\'dashboards\':\'mural\')"><span class="mark" aria-hidden="true"></span><span>Portal da CPA<small>Faculdade Impacta</small></span></div><nav aria-label="Principal">';
  menu().forEach(function(i){h+='<a href="#'+i[0]+'"'+(UI.view===i[0]?' aria-current="page"':'')+'>'+i[1]+'</a>'});
  h+='</nav><div class="who">';
  if(DB.u){
    var cleanName=DB.u.n?DB.u.n.replace(/,/g,' ').replace(/\s+/g,' ').trim():'';
    var label=cleanName?esc(cleanName)+' · '+ROLE[role()]:'Perfil: '+ROLE[role()];
    h+='<span class="badge-role">'+label+'</span><button class="alt sm" onclick="logout()">Sair</button>';
  }else{
    h+='<button class="sm" onclick="go(\'login\')">Entrar</button>';
  }
  $('#bar').innerHTML=h+'</div>';
}

function render(){
  var v=(location.hash||'').slice(1)||(DB.u?'dashboards':'mural');
  if(v==='dashboards'&&!DB.u)v='login';
  if(v==='acessos'&&role()!=='cpa')v=DB.u?'dashboards':'login';
  if(['login','dashboards','mural','relatorios','contato','acessos'].indexOf(v)<0)v='mural';
  UI.view=v;bar();
  $('#app').innerHTML=({login:vLogin,dashboards:vDash,mural:vMural,relatorios:vRel,contato:vContato,acessos:vAcessos})[v]();
  if(v==='acessos'){
    fetchLogsFromDb(true).then(function(){
      var tb=$('#logs-tbody');
      if(tb)tb.innerHTML=renderLogsRows();
    });
  }
  window.scrollTo(0,0);
}

function vLogin(){
  var otpHtml='';
  if(OTP.sent){

function resetOtp(){

async function sendInstOtp(){
  var e=$('#inst-em').value.trim().toLowerCase();
  var errEl=$('#lerr');
  errEl.style.color='var(--err)';
  errEl.textContent='';

  if(!e||!isImpactaDomain(e)){
    errEl.textContent='Informe um e-mail institucional válido (@aluno.impacta.edu.br ou @impacta.edu.br).';
    return;
  }

  // Contas base de demonstração entram direto para facilitar testes e apresentação
  var coreDemo=DB.users[e];
  if(coreDemo&&coreDemo.core){
    DB.u={n:coreDemo.n,r:coreDemo.r,tipo:'sso'};
    saveSession();
    await registrarAcesso(e,DB.u,'Conta Base CPA');
    toast('Autenticado com sucesso.');
    go('dashboards');
    return;
  }

  // Consulta no banco em tempo real se é Coordenação / Admin CPA autorizado
  var {data,error}=await sb.from('usuarios_cpa').select('*').eq('email',e).eq('tipo','sso').maybeSingle();
  if(!error&&data){
    DB.users[e]={n:data.nome||formatNameFromEmail(e),r:data.role,tipo:'sso'};
  }

  var u=DB.users[e];
  var targetRole='';
  var targetName='';

  if(u&&u.tipo==='sso'){
    targetRole=u.r;
    targetName=u.n||formatNameFromEmail(e);
  }else if(isStudentDomain(e)){
    targetRole='aluno';
    targetName=formatNameFromEmail(e);
  }else{
    if(e.indexOf('@aluno.')>-1){
      errEl.textContent='Formato discente inválido. Use nome.sobrenome@aluno.impacta.edu.br.';
    }else{
      errEl.textContent='Acesso negado: o e-mail "'+e+'" não está autorizado como Coordenação ou CPA.';
    }
    return;
  }

  var btn=$('#btn-inst-otp');
  if(btn){btn.disabled=true;btn.textContent='Enviando código...';}

  var code=String(Math.floor(100000+Math.random()*900000));
  try{
    await emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{
      to_name:targetName,
      to_email:e,
      portal_link:getPortalLoginUrl(),
      token:code,
      validade:'10 minutos (Código de Verificação Institucional)'
    });
    OTP={
      email:e,
      code:code,
      expires:Date.now()+10*60*1000,
      role:targetRole,
      nome:targetName,
      sent:true
    };
    toast('Código enviado para '+e+'!');
    render();
    setTimeout(function(){var inp=$('#otp-code');if(inp)inp.focus();},50);
  }catch(err){
    console.error('Erro EmailJS:',err);
    if(btn){btn.disabled=false;btn.textContent='Receber código de acesso no e-mail';}
    errEl.textContent='Não foi possível enviar o código: '+(err.text||err.message||'verifique o EmailJS.');
  }
}

async function verifyInstOtp(){
  var typed=($('#otp-code').value||'').trim();
  var errEl=$('#lerr');
  errEl.style.color='var(--err)';

  if(!OTP.sent||!OTP.code){
    errEl.textContent='Solicite um código primeiro.';
    return;
  }
  if(Date.now()>OTP.expires){
    errEl.textContent='Código expirado. Clique em "Trocar e-mail" para solicitar um novo.';
    return;
  }
  if(typed!==OTP.code){
    errEl.textContent='Código incorreto. Verifique o número de 6 dígitos enviado para '+OTP.email+'.';
    return;
  }

  var verifiedEmail=OTP.email;
  DB.u={n:OTP.nome,r:OTP.role,tipo:'sso'};
  OTP={email:'',code:'',expires:0,role:'aluno',nome:'',sent:false};
  saveSession();
  await registrarAcesso(verifiedEmail,DB.u,'Verificação E-mail Impacta');
  toast('E-mail verificado! Bem-vindo(a), '+DB.u.n+'.');
  go('dashboards');
}

async function requestTokenEmail(){
  var e=$('#em').value.trim().toLowerCase();
  var errEl=$('#lerr');
  errEl.style.color='var(--err)';
  if(!e){
    errEl.textContent='Digite seu e-mail cadastrado acima para receber o token.';
    return;
  }
  if(isImpactaDomain(e)){
    errEl.textContent='Contas da Impacta devem usar o campo "E-mail institucional Impacta" acima.';
    return;
  }
  var u=DB.users[e];
  if(!u||u.tipo!=='token'){
    errEl.textContent='E-mail não habilitado como avaliador externo. Solicite o cadastro à CPA.';
    return;
  }
  var hoje=new Date().toISOString().slice(0,10);
  if(u.exp&&u.exp<hoje){
    errEl.textContent='O token cadastrado para este e-mail expirou em '+fmt(u.exp)+'. Solicite renovação à CPA.';
    return;
  }
  var btn=$('#btn-req-tk');
  if(btn){btn.disabled=true;btn.textContent='Enviando...';}
  var ok=await sendInviteEmail(e);
  if(btn){btn.disabled=false;btn.textContent='Receber token por e-mail';}
  if(ok){
    errEl.style.color='var(--ok)';
    errEl.textContent='Token enviado para '+e+'! Verifique sua caixa de entrada ou spam.';
  }
}

async function loginToken(){
  var e=$('#em').value.trim().toLowerCase(),t=$('#tk').value.trim();
  $('#lerr').style.color='var(--err)';
  if(isImpactaDomain(e)){
    $('#lerr').textContent='Contas da Impacta devem usar o campo "E-mail institucional Impacta" acima.';
    return;
  }
  var u=DB.users[e];
  if(u&&u.tipo==='token'&&u.token===t){
    var hoje=new Date().toISOString().slice(0,10);
    if(u.exp&&u.exp<hoje){
      $('#lerr').textContent='Este token expirou em '+fmt(u.exp)+'. Solicite um novo código à CPA.';
      return;
    }
    DB.u=u;
    saveSession();
    await registrarAcesso(e,DB.u,'Token MEC');
    toast('Acesso externo autorizado.');go('dashboards');
  }else{
    $('#lerr').textContent='E-mail ou token de acesso inválido.';
  }
}

function logout(){
  // Apenas encerra a sessão atual (DB.logs permanece intacto no banco e no backup)
  DB.u=null;
  saveSession();
  toast('Sessão encerrada.');
  go('mural');
}

function renderMuralList(){
  var grid=$('#mural-grid');if(!grid)return;
  var q=UI.muralSearch.toLowerCase();
  var list=DB.mural.filter(function(m){
    var matchSt=UI.muralFilter==='Todos'||m.st===UI.muralFilter;
    var matchQ=!q||(m.area+m.dem+m.res).toLowerCase().indexOf(q)>-1;
    return matchSt&&matchQ;
  }).sort(function(a,b){return b.data<a.data?-1:1});

  if(!list.length){grid.innerHTML='<p class="meta">Nenhuma devolutiva encontrada para este filtro.</p>';return}
  grid.innerHTML=list.map(function(m){
    return '<article class="panel"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><strong>'+esc(m.area)+'</strong><span class="tag '+(m.st==='Resolvido'?'ok':'wip')+'">'+esc(m.st)+'</span></div><p style="margin:10px 0 0"><span class="meta">Demanda</span><br>'+esc(m.dem)+'</p><div class="resp"><span class="meta">Resposta · '+fmt(m.data)+'</span><br>'+esc(m.res)+'</div>'+
    (role()==='cpa'?'<div style="margin-top:14px;display:flex;gap:8px"><button class="alt sm" onclick="toggleMural('+m.id+')">Alternar status</button><button class="alt sm" onclick="delMural('+m.id+')">Remover</button></div>':'')+'</article>';
  }).join('');
}

async function addMural(){
  var a=$('#ma').value.trim(),d=$('#md').value.trim(),r=$('#mr').value.trim(),st=$('#ms').value;
  if(!a||!d||!r){toast('Preencha todos os campos.');return}
  toast('Salvando devolutiva...');
  var {data,error}=await sb.from('mural').insert([{area:a,demanda:d,resposta:r,status:st}]).select();
  if(error){toast('Erro ao publicar: '+error.message);return}
  if(data&&data[0])DB.mural.unshift({id:data[0].id,area:data[0].area,dem:data[0].demanda,res:data[0].resposta,st:data[0].status,data:data[0].data});
  toast('Devolutiva salva no Supabase!');render();
}

async function toggleMural(id){
  var item=DB.mural.filter(function(m){return m.id===id})[0];
  if(!item)return;
  var novo=item.st==='Resolvido'?'Em andamento':'Resolvido';
  var {error}=await sb.from('mural').update({status:novo}).eq('id',id);
  if(error){toast('Erro: '+error.message);return}
  item.st=novo;toast('Status atualizado no banco.');render();
}

async function delMural(id){
  var {error}=await sb.from('mural').delete().eq('id',id);
  if(error){toast('Erro: '+error.message);return}
  DB.mural=DB.mural.filter(function(m){return m.id!==id});
  toast('Devolutiva removida.');render();
}

function vRel(){
  var h='<h1>Relatórios e boletins</h1><p class="lead">Documentos institucionais da CPA disponíveis para consulta pública e download.</p>';
  if(role()==='cpa')h+='<details class="panel" style="margin-bottom:20px"><summary>+ Publicar novo documento</summary><label for="rt">Título do documento</label><input id="rt" placeholder="Ex: Relatório Integral de Autoavaliação 2026"><label for="rp">Categoria</label><select id="rp"><option>Relatório</option><option>Boletim</option><option>Ata</option></select><label for="rf">Link do PDF (Google Drive / Storage) ou deixe em branco para gerar automático</label><input id="rf" placeholder="https://... ou relatorio-2026.pdf"><div style="margin-top:14px"><button class="acc" onclick="addRel()">Salvar documento</button></div></details>';
  h+='<div class="panel">';
  if(!DB.rels.length)h+='<p class="meta">Nenhum relatório cadastrado ainda. Entre como Admin CPA para publicar.</p>';
  DB.rels.forEach(function(r){
    var isUrl=r.arq&&r.arq.indexOf('http')===0;
    var btn=isUrl
      ?'<a class="btn alt sm" href="'+esc(r.arq)+'" target="_blank" rel="noopener">Abrir PDF</a>'
      :'<button class="alt sm" onclick="downloadGeneratedPdf('+r.id+',this)">Baixar PDF</button>';
    h+='<div class="row"><div><strong>'+esc(r.t)+'</strong><div class="meta"><span class="tag">'+esc(r.tipo)+'</span> Publicado em '+fmt(r.data)+'</div></div><div style="display:flex;gap:8px">'+btn+(role()==='cpa'?'<button class="alt sm" onclick="delRel('+r.id+')">Remover</button>':'')+'</div></div>';

}

async function addRel(){
  var t=$('#rt').value.trim(),arq=$('#rf').value.trim(),tipo=$('#rp').value;
  if(!t){toast('Informe o título do documento.');return}
  if(!arq)arq=t.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.pdf';
  var {data,error}=await sb.from('relatorios').insert([{titulo:t,tipo:tipo,arquivo_url:arq}]).select();
  if(error){toast('Erro: '+error.message);return}
  if(data&&data[0])DB.rels.unshift({id:data[0].id,t:data[0].titulo,tipo:data[0].tipo,data:data[0].data,arq:data[0].arquivo_url});
  toast('Documento salvo no Supabase!');render();
}

async function delRel(id){
  var {error}=await sb.from('relatorios').delete().eq('id',id);
  if(error){toast('Erro: '+error.message);return}
  DB.rels=DB.rels.filter(function(r){return r.id!==id});
  toast('Documento removido.');render();
}

async function saveContato(){

}

function sendMsg(){

function renderLogsRows(){

    return '<tr><td>'+fmtDateTime(l.acessado_em)+'</td><td>'+esc(l.nome||'-')+'</td><td>'+esc(l.email)+'</td><td><span class="tag">'+esc(ROLE[l.role]||l.role)+'</span></td><td>'+esc(l.metodo)+'</td></tr>';
  }).join('');
}

async function addInstBatch(){
  var raw=$('#ie').value.trim(),r=$('#ir').value;
  if(!raw){toast('Cole ao menos um e-mail institucional.');return;}
  var lines=raw.split(/[\n,;]+/).map(function(s){return s.trim().toLowerCase()}).filter(Boolean);
  var valid=[],invalid=[];
  lines.forEach(function(e){
    if(isImpactaDomain(e))valid.push(e);
    else invalid.push(e);
  });
  if(invalid.length){
    toast('E-mail inválido ignorado: '+invalid[0]+' (use @impacta.edu.br)');
    if(!valid.length)return;
  }

  var btn=$('#btn-add-inst');
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}

  var rows=valid.map(function(e){
    return {email:e,nome:formatNameFromEmail(e),role:r,tipo:'sso',token:null,expira_em:null};
  });

  var {error}=await sb.from('usuarios_cpa').upsert(rows);
  if(error){
    toast('Erro ao salvar no banco: '+error.message);
    if(btn){btn.disabled=false;btn.textContent='Autorizar e-mail(s) no banco';}
    return;
  }
  rows.forEach(function(row){
    DB.users[row.email]={n:row.nome,r:row.role,tipo:'sso'};
  });
  toast(rows.length+' e-mail(s) autorizado(s) com sucesso!');
  render();
}

async function sendInviteEmail(email){
  var u=DB.users[email];if(!u)return false;
  var portalLink=getPortalLoginUrl();
  try{
    await emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{
      to_name:u.n,
      to_email:email,
      portal_link:portalLink,
      token:u.token,
      validade:fmt(u.exp)
    });
    toast('E-mail enviado com sucesso para '+email+'!');
    return true;
  }catch(err){
    console.error('Erro EmailJS:',err);
    toast('Erro ao enviar e-mail: '+(err.text||err.message||'verifique o EmailJS'));
    return false;
  }
}

async function addMec(){
  var n=$('#mn').value.trim(),e=$('#me').value.trim().toLowerCase(),t=$('#mt').value.trim(),x=$('#mx').value;
  if(!n||!e||!t){toast('Preencha nome, e-mail e token.');return}
  var btn=$('#btn-add-mec');
  if(btn){btn.disabled=true;btn.textContent='Salvando e enviando...';}

  var {error}=await sb.from('usuarios_cpa').upsert([{email:e,nome:n,role:'aval',tipo:'token',token:t,expira_em:x}]);
  if(error){
    toast('Erro ao salvar no banco: '+error.message);
    if(btn){btn.disabled=false;btn.textContent='Salvar e enviar por e-mail';}
    return;
  }
  DB.users[e]={n:n,r:'aval',tipo:'token',token:t,exp:x};
  await sendInviteEmail(e);
  render();
}

function copyInvite(email){
  var u=DB.users[email];if(!u)return;
  var msg='Olá, '+u.n+'.\n\nSegue sua credencial temporária para acesso ao Portal da CPA – Faculdade Impacta:\n• Link: '+getPortalLoginUrl()+'\n• E-mail: '+email+'\n• Token de acesso: '+u.token+'\n• Válido até: '+fmt(u.exp);
  if(navigator.clipboard){
    navigator.clipboard.writeText(msg).then(function(){toast('Convite copiado!')});
  }else{
    prompt('Copie o convite abaixo:',msg);
  }
}

async function delUser(e){
  var {error}=await sb.from('usuarios_cpa').delete().eq('email',e);
  if(error){toast('Erro: '+error.message);return}
  delete DB.users[e];toast('Acesso revogado do banco.');render();
}
